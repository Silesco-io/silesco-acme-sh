name: PHP SDK offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Acquire exact upstream source; never execute it
        run: |
          git -c core.autocrlf=false clone --depth 1 --branch 3.1.6 https://github.com/acmesh-official/acme.sh.git "$RUNNER_TEMP/acme-source"
          test "$(git -C "$RUNNER_TEMP/acme-source" rev-parse HEAD)" = 807da6498377ee5e0cf43a78091f46f12dc59a89
          printf '%s  %s\n' 8522e614de31e4e36d1c11e45d90721013b37f91bc3d9aa437fe1844d83400fa "$RUNNER_TEMP/acme-source/allowed_signers" | sha256sum -c -
          git -C "$RUNNER_TEMP/acme-source" -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/acme-source/allowed_signers" verify-tag 3.1.6
      - name: Check catalog reproduction and all declared fields
        run: node scripts/catalog-test.mjs "$RUNNER_TEMP/acme-source"
      - name: PHP 8.3 Linux; no network or provider credentials
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/sdk,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/acme-source,dst=/upstream,readonly" \
            --env ACME_SH_TEST_SOURCE=/upstream --entrypoint /bin/sh \
            dunglas/frankenphp:php8.3-bookworm@sha256:4c0ae6933ee2c08d82a2ce1593c37c754d3794a706c26eae7b3a6c21d2353918 \
            -c 'php /sdk/tests/run.php && php /sdk/tests/local-executor.php && php /sdk/scripts/reference.php --check'
